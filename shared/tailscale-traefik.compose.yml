# Base Tailscale + Traefik services — single source of truth.
# Extend these services from a project compose file via `extends`.
#
# NOTE:
# - Sequences are REPLACED (not merged) by extends. Any override of `command`,
#   `volumes`, etc. in an extending service must repeat the full list.
# - Relative paths defined HERE resolve relative to this file, so project-local
#   paths (env_file, secret files, ./traefik config) must be defined in the
#   extending project.
# - Top-level secrets/volumes/networks below only satisfy base-file validation;
#   they are NOT merged into extending projects — each project must declare its
#   own top-level secrets/volumes/networks, and the model IDs must align with
#   what is defined below.
#
# Required env vars per project (.env):
#   TS_HOSTNAME             e.g. "homelab" | "games-server"
#   PROJECT_PREFIX          e.g. "homelab" | "games_server"
#   TRAEFIK_INSTANCE        e.g. "homelab" | "games"
#   TRAEFIK_SUBDOMAIN       e.g. "traefik.ts" | "traefik"
#   CF_API_EMAIL, CF_DOMAIN, ACME_CA_SERVER, ACME_STORAGE (as before)
services:
  tailscale:
    image: tailscale/tailscale:v1.102.3
    hostname: ${TS_HOSTNAME}
    container_name: ${PROJECT_PREFIX}_tailscale
    secrets:
      - ts-authkey
    # Replace TS_AUTHKEY with new file env var when tailscale adds support
    # https://github.com/tailscale/tailscale/issues/14210#issuecomment-4185439890
    environment:
      TS_AUTHKEY: file:/run/secrets/ts-authkey
      TS_STATE_DIR: "var/lib/tailscale"
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--ssh"
      TS_ENABLE_HEALTH_CHECK: "true"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz" ]
    volumes:
      - /dev/net/tun:/dev/net/tun
      - tailscale:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      - tailscale
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.13
    container_name: ${PROJECT_PREFIX}_traefik
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - cf-dns-api-token
    environment:
      TZ: "Australia/Sydney"
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN_FILE: run/secrets/cf_dns_api_token
      LEGO_DISABLE_CNAME_SUPPORT: "true"
    depends_on:
      - tailscale
    network_mode: service:tailscale
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket to watch for Traefik
      - ./traefik:/etc/traefik/
      - traefik-certs:/certs
    command:
      - --accesslog=true
      - --api.insecure=true
      - --api.debug=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # will ONLY watch for containers with this label
      - --providers.docker.constraints=Label(`traefik.instance`,`${TRAEFIK_INSTANCE:-traefik}`)
      - --providers.file.watch=true
      - --providers.file.directory=/etc/traefik
      - --ping=true
      - --ping.entrypoint=traefik
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      # TLS - ACME resolver (switch CA/storage via env vars for staging/prod)
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=${CF_API_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.caServer=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesResolvers.letsencrypt.acme.storage=${ACME_STORAGE:-/certs/acme.json}
      - --certificatesResolvers.letsencrypt.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

    labels:
      - tailscale=true
      - traefik.enable=true
      - traefik.instance=${TRAEFIK_INSTANCE:-traefik} # watch in expected instance
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_SUBDOMAIN:-traefik.ts}.${CF_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.services.traefik.loadbalancer.server.port=8080

# The declarations below exist only so this file parses standalone; `extends`
# does not merge top-level elements into the extending project.
secrets:
  ts-authkey:
    environment: TS_AUTHKEY_PLACEHOLDER
  cf-dns-api-token:
    environment: CF_DNS_API_TOKEN_PLACEHOLDER

volumes:
  tailscale:
    name: tailscale
    external: true
  traefik-certs:
    name: traefik_certs
    external: true

networks:
  tailscale:
    name: tailscale
    external: true
