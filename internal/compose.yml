name: homelab
services:
  # Tailscale + Traefik are defined in ../base/tailscale-traefik.compose.yml.
  # Instance-specific values come from .env (see that file for required vars).
  # NOTE: `extends` REPLACES sequences (command/volumes/labels) rather than
  # merging them — any override here must repeat the full list from the base.
  tailscale:
    extends:
      file: ../base/tailscale-traefik.compose.yml
      service: tailscale
    env_file:
      - .env

  traefik:
    extends:
      file: ../base/tailscale-traefik.compose.yml
      service: traefik
    env_file:
      - .env

  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.11.1
    container_name: arcane
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3552:3552"
    networks:
      - homelab_tailscale
    secrets:
      - arcane_encryption_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - arcane_backups:/backups
      - ../games/hytale:/app/data/projects/hytale
      - ../games/valheim:/app/data/projects/valheim
      - ../games/ts_traefik:/app/data/projects/ts_traefik
      - ./:/app/data/projects/internal
    environment:
      - APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=file:/run/secrets/arcane_encryption_key
      - LOG_LEVEL=info
      - LOG_JSON=false
      - OIDC_ENABLED=false
      - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate
    labels:
      - tailscale=true
      - traefik.enable=true
      - traefik.instance=homelab # watch in expected instance
      - traefik.http.routers.arcane.rule=Host(`${ARCANE_SUBDOMAIN:-arcane.ts}.${CF_DOMAIN}`)
      - traefik.http.routers.arcane.entrypoints=websecure
      - traefik.http.routers.arcane.tls.certresolver=letsencrypt
      - traefik.http.services.arcane.loadbalancer.server.port=3552

secrets:
  ts_authkey:
    file: ./secrets/ts_authkey
  cf_dns_api_token:
    file: ./secrets/cf_dns_api_token
  arcane_encryption_key:
    file: ./secrets/arcane_encryption_key

volumes:
  homelab_tailscale:
    name: homelab_tailscale
    external: true
  homelab_traefik_certs:
    name: homelab_traefik_certs
    external: true
  arcane_data:
    name: arcane_data
    external: true
  arcane_backups:
    name: arcane_backups
    external: true

networks:
  homelab_tailscale:
    name: homelab_tailscale
    external: true
