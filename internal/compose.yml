name: homelab
services:
  tailscale:
    extends:
      file: ../shared/tailscale-traefik.compose.yml
      service: tailscale
    env_file:
      - .env
    environment:
      TS_ROUTES: "${PIHOLE_LAN_IP}/32"
    sysctls:
      net.ipv4.ip_forward: "1"

  traefik:
    extends:
      file: ../shared/tailscale-traefik.compose.yml
      service: traefik
    env_file:
      - .env

  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.17.3
    container_name: arcane
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3552:3552"
    networks:
      - tailscale
    secrets:
      - arcane_encryption_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - arcane_backups:/backups
      - ../games/hytale:/app/data/projects/hytale
      - ../games/valheim:/app/data/projects/valheim
      - ../games/ts_traefik:/app/data/projects/ts_traefik
      - ./:/app/data/projects/internal
    environment:
      - APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=file:/run/secrets/arcane_encryption_key
      - LOG_LEVEL=info
      - LOG_JSON=false
      - OIDC_ENABLED=false
      - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate
    labels:
      - tailscale=true
      - traefik.enable=true
      - traefik.instance=homelab # watch in expected instance
      - traefik.http.routers.arcane.rule=Host(`${ARCANE_SUBDOMAIN:-arcane.ts}.${CF_DOMAIN}`)
      - traefik.http.routers.arcane.entrypoints=websecure
      - traefik.http.routers.arcane.tls.certresolver=letsencrypt
      - traefik.http.services.arcane.loadbalancer.server.port=3552

  pihole:
    image: pihole/pihole:2026.11.0
    container_name: pihole
    hostname: homelab
    restart: unless-stopped
    secrets:
      - pihole_webpassword
    networks:
      - tailscale
    ports:
      - "${PIHOLE_LAN_IP}:53:53/tcp"
      - "${PIHOLE_LAN_IP}:53:53/udp"
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      - "8081:80/tcp"
    volumes:
      - pihole_logs:/var/log/pihole
      - pihole_data:/etc/pihole
      - pihole_dnsmasq_data:/etc/dnsmasq.d
    healthcheck:
      test: [ "CMD", "dig", "+time=2", "+tries=1", "@127.0.0.1", "pi.hole" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      TZ: "Australia/Sydney"
      WEBPASSWORD_FILE: pihole_webpassword
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_hostRecord: "${FTLCONF_DNS_HOSTRECORD}"
      FTLCONF_dns_reply_host_force4: "true"
      FTLCONF_dns_reply_host_IPv4: "${PIHOLE_LAN_IP}"
    labels:
      - tailscale=true
      - traefik.enable=true
      - traefik.instance=${TRAEFIK_INSTANCE:-homelab} # watch in expected instance
      - traefik.http.routers.pihole.rule=Host(`${PIHOLE_SUBDOMAIN:-pihole.ts}.${CF_DOMAIN}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.routers.pihole.tls.certresolver=letsencrypt
      - traefik.http.services.pihole.loadbalancer.server.port=80

secrets:
  ts_authkey:
    file: ./secrets/ts_authkey
  cf_dns_api_token:
    file: ./secrets/cf_dns_api_token
  arcane_encryption_key:
    file: ./secrets/arcane_encryption_key
  pihole_webpassword:
    file: ./secrets/pihole_webpassword

# Model IDs align with what is defined in the base compose
volumes:
  tailscale:
    name: homelab_tailscale
    external: true
  traefik_certs:
    name: homelab_traefik_certs
    external: true
  arcane_data:
    name: arcane_data
    external: true
  arcane_backups:
    name: arcane_backups
    external: true
  pihole_logs:
    name: pihole_logs
    external: true
  pihole_data:
    name: pihole_data
    external: true
  pihole_dnsmasq_data:
    name: pihole_dnsmasq_data
    external: true

networks:
  tailscale:
    name: homelab_tailscale
    external: true
